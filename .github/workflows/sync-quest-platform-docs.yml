name: Sync Quest Platform docs

# The quest-setup skill reads the Quest Platform's own assistant instructions and
# documentation from two generated files. This job copies them from the published docs page
# and opens a pull request when they changed, so a person sees every change before an
# assistant reads it. It never pushes to main.
#
# CI on the sync pull request: a push or pull request made with the default GITHUB_TOKEN does
# not start other workflows, so Validate would never run on it. Set the repository secret
# QUEST_DOCS_SYNC_TOKEN (a GitHub App installation token or a fine-grained token with
# Contents and Pull requests write on this repository) and the push and the pull request are
# made with it, so Validate runs as on any pull request. Without the secret the job still
# runs the same checks itself before opening the pull request, and says so in its body.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-quest-platform-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BRANCH: chore/sync-quest-platform-docs
      HAS_SYNC_TOKEN: ${{ secrets.QUEST_DOCS_SYNC_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.QUEST_DOCS_SYNC_TOKEN || github.token }}

      - name: Copy the published page
        run: python3 -I .github/scripts/sync_quest_platform_docs.py

      - name: Mirror for Cursor
        run: |
          set -euo pipefail
          mkdir -p .cursor/skills/quest-setup/references
          cp skills/quest-setup/references/quest-platform.md \
             skills/quest-setup/references/quest-platform-docs.md \
             .cursor/skills/quest-setup/references/

      - name: Check what changed
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- skills/quest-setup/references .cursor/skills/quest-setup/references; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The copy is up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The same checks Validate runs on these files, so a broken copy never reaches a pull
      # request even when Validate cannot start on it.
      - name: Validate skills and links
        if: steps.diff.outputs.changed == 'true'
        run: python3 -I .github/scripts/validate_skills.py

      - name: Run quest-setup tests
        if: steps.diff.outputs.changed == 'true'
        working-directory: skills/quest-setup
        run: python3 -m unittest discover -s tests -v

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.QUEST_DOCS_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          find skills .cursor -name __pycache__ -type d -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -- skills/quest-setup/references .cursor/skills/quest-setup/references
          git commit -m "chore(quest-setup): sync the Quest Platform docs copy"
          git push --force origin "$BRANCH"
          body="The published Quest Platform AI skill page changed. This updates the two generated files the quest-setup skill reads. Review the diff: these files are instructions an assistant follows."
          if [ "$HAS_SYNC_TOKEN" = "true" ]; then
            body="$body

          The skill validator and the quest-setup tests passed in the sync job, and Validate runs on this pull request."
          else
            body="$body

          The skill validator and the quest-setup tests passed in the sync job. Validate does not start on its own here, because the pull request was opened with the default token: close and reopen it to run Validate, or set the QUEST_DOCS_SYNC_TOKEN secret (see the workflow file)."
          fi
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(quest-setup): sync the Quest Platform docs copy" --body "$body"
          else
            gh pr edit "$number" --body "$body"
          fi
