name: Sync provider files

# Safety net only. The Validate workflow fails any PR whose `.cursor/skills/` or
# `CLAUDE.md` has drifted from `skills/` and `AGENTS.md`, so contributors commit the
# generated files themselves. This job exists to repair direct pushes to main.
#
# Runs on main only. Previously it ran on every branch, which meant it committed and
# force-advanced contributors' feature branches while they were still working on them.
on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a sync mid-push; queue instead.
concurrency:
  group: sync-providers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Don't re-trigger on this workflow's own commit.
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync skills and CLAUDE.md
        run: |
          set -euo pipefail

          rm -rf .cursor/skills
          mkdir -p .cursor/skills
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            if [ -f "${skill_dir}SKILL.md" ]; then
              cp -R "$skill_dir" ".cursor/skills/${skill_name}"
              echo "Synced: .cursor/skills/${skill_name}"
            fi
          done

          cp AGENTS.md CLAUDE.md
          echo "Synced: CLAUDE.md"

      - name: Commit generated files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cursor/skills/ CLAUDE.md
          if git diff --staged --quiet; then
            echo "Already in sync — nothing to commit."
            exit 0
          fi
          git commit -m "chore: sync provider files from skills/ and AGENTS.md [skip ci]"
          git push
