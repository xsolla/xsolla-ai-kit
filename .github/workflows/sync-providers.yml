name: Sync provider files

on:
  push:
    paths:
      - 'skills/**'
      - 'AGENTS.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync skills and CLAUDE.md
        run: |
          set -euo pipefail

          rm -rf .cursor/skills
          mkdir -p .cursor/skills
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            if [ -f "${skill_dir}SKILL.md" ]; then
              cp -R "$skill_dir" ".cursor/skills/${skill_name}"
              echo "Synced: .cursor/skills/${skill_name}"
            fi
          done

          cp AGENTS.md CLAUDE.md
          echo "Synced: CLAUDE.md"

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .cursor/skills/ CLAUDE.md
          git diff --staged --quiet || git commit -m "chore: sync provider files from skills/ and AGENTS.md [skip ci]"
          git push
