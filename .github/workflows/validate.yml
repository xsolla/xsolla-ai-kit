name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only ever reads the tree.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skills, registries and generated files
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA rather than a moving tag — a compromised tag on a
      # third-party action would otherwise run with this repo's token.
      # Dependabot keeps these current (see .github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate skills, registries, links and provider sync
        run: python3 .github/scripts/validate_skills.py

  scripts:
    name: Skill scripts — unit tests and line length
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      # No setup-python step and no install step on purpose: these scripts are
      # standard-library only, and running them on the runner's stock python3 is
      # the same guarantee a partner gets on their own machine.
      - name: Report the interpreter the tests ran on
        run: python3 -VV

      - name: listing-import unit tests
        working-directory: skills/listing-import/scripts
        run: python3 -m unittest discover -s tests -t . -v

      - name: No Python line over 100 columns
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            awk -v f="$f" 'length($0) > 100 {
              printf "::error file=%s,line=%d::line is %d columns, limit is 100\n", f, FNR, length($0)
              found = 1
            } END { exit found ? 1 : 0 }' "$f" || rc=1
          done < <(find skills -name '*.py' -type f)
          exit $rc

  workflow-permissions:
    name: Workflows declare least-privilege permissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Every workflow must declare `permissions:` and pin actions to a SHA
        run: |
          set -euo pipefail
          rc=0

          for wf in .github/workflows/*.yml; do
            if ! grep -q '^permissions:' "$wf"; then
              echo "::error file=$wf::missing a top-level \`permissions:\` block (defaults are over-privileged)"
              rc=1
            fi
            # Third-party actions must be pinned to a 40-hex commit SHA.
            while read -r ref; do
              case "$ref" in
                *@[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
                ./*) ;;
                *)
                  echo "::error file=$wf::action '$ref' is not pinned to a full commit SHA"
                  rc=1
                  ;;
              esac
            done < <(grep -oE '^\s*-?\s*uses:\s*\S+' "$wf" | sed -E 's/.*uses:\s*//')
          done

          exit $rc
