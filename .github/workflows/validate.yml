name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only ever reads the tree.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skills, registries and generated files
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA rather than a moving tag — a compromised tag on a
      # third-party action would otherwise run with this repo's token.
      # Dependabot keeps these current (see .github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate skills, registries, links and provider sync
        run: python3 .github/scripts/validate_skills.py

  scripts:
    name: Skill script unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      # No setup-python and no install step on purpose: skill scripts are
      # standard-library only, so the runner's stock python3 is the same
      # guarantee a partner gets on their own machine.
      - name: Report the interpreter the tests ran on
        run: python3 -VV

      # Runs every skill's suite, in either of the two layouts skills use:
      #   skills/<skill>/scripts/tests/  a package (has __init__.py); needs -t .
      #                                  so scripts/ is the import root
      #   skills/<skill>/tests/          plain modules that put ../scripts on
      #                                  sys.path themselves; -t . would fail
      #                                  with "Start directory is not importable"
      # A skill without tests is not an error — most skills are prose only.
      - name: Unit tests for every skill that has them
        run: |
          set -euo pipefail
          ran=0
          for suite in skills/*/scripts/tests skills/*/tests; do
            [ -d "$suite" ] || continue
            dir="$(dirname "$suite")"
            echo "::group::$suite"
            if [ -f "$suite/__init__.py" ]; then
              ( cd "$dir" && python3 -m unittest discover -s tests -t . -v )
            else
              ( cd "$dir" && python3 -m unittest discover -s tests -v )
            fi
            echo "::endgroup::"
            ran=1
          done
          if [ "$ran" -eq 0 ]; then
            echo "No skill ships tests yet — nothing to run."
          fi

  workflow-permissions:
    name: Workflows declare least-privilege permissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Every workflow must declare `permissions:` and pin actions to a SHA
        run: |
          set -euo pipefail
          rc=0

          for wf in .github/workflows/*.yml; do
            if ! grep -q '^permissions:' "$wf"; then
              echo "::error file=$wf::missing a top-level \`permissions:\` block (defaults are over-privileged)"
              rc=1
            fi
            # Third-party actions must be pinned to a 40-hex commit SHA.
            while read -r ref; do
              case "$ref" in
                *@[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
                ./*) ;;
                *)
                  echo "::error file=$wf::action '$ref' is not pinned to a full commit SHA"
                  rc=1
                  ;;
              esac
            done < <(grep -oE '^\s*-?\s*uses:\s*\S+' "$wf" | sed -E 's/.*uses:\s*//')
          done

          exit $rc
