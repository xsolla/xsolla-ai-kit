version: 2

updates:
  # Workflow actions are pinned to commit SHAs for supply-chain safety, which means
  # they don't get security updates on their own. Dependabot bumps the pins and keeps
  # the `# vX.Y.Z` comment beside them accurate.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
    reviewers:
      - JavadManashti
